<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: приложение занимает весь экран iPhone, а отступы
         под «чёлку» и полоску жестов берутся из env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Remedy" />
    <link rel="apple-touch-icon" href="/Remedy/couples/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/Remedy/couples/icon-192.png" />
    <link rel="manifest" href="/Remedy/couples/manifest.json" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #FFF7F5;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Чтобы открыть Remedy, включите JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
