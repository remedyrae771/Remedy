name: Deploy Aqsha to GitHub Pages

# Сайт Aqsha: https://remedyrae771.github.io/Remedy/ (статические файлы из docs/).
# Приложение для пар переехало в отдельный репозиторий: https://remedyrae771.github.io/zhanka/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r docs/. site/
          touch site/.nojekyll
          # Старые ссылки-приглашения /Remedy/couples/?join=… ведут в новое приложение для пар.
          cat > site/404.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Страница не найдена</title>
          <script>
            var p = location.pathname;
            if (p.indexOf('/Remedy/couples') === 0) location.replace('https://remedyrae771.github.io/zhanka/' + location.search);
            else location.replace('/Remedy/');
          </script>
          <p>Страница не найдена. <a href="/Remedy/">На главную</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
